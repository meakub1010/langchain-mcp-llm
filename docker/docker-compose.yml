name: langchain-mcp-llm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: langchain-mcp-llm-postgres
    restart:  unless-stopped
    environment:
      POSTGRES_USER: langchain_mcp_llm
      POSTGRES_PASSWORD: langchain_mcp_llm_dev
      POSTGRES_DB: langchain_mcp_llm
    ports:
      - "5433:5432"
    volumes:
      - /Volumes/Ext-Drive/Development/langchain-mcp-llm-data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: langchain-mcp-llm-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - /Volumes/Ext-Drive/Development/langchain-mcp-llm-data/redis:/data